{% extends 'users/user_base.html' %}
{% block content %}

<!-- Background + Styling -->
<style>
  body {
    background-image: url('https://images.unsplash.com/photo-1607871142344-c3c679e0c9d3?auto=format&fit=crop&w=1950&q=80');
    background-size: cover;
    background-position: center;
    font-family: 'Arial', sans-serif;
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
  }

  .rescan-button:hover {
    background-color: #0d9488;
  }
</style>

<div class="flex justify-center items-center py-4 sm:py-8">
  <div class="glass-card w-full max-w-xl text-white text-center p-5 sm:p-8">
    <img src="https://cdn-icons-png.flaticon.com/512/2910/2910791.png" alt="QR Result" class="w-16 h-16 sm:w-20 sm:h-20 mx-auto mb-4">

    <h2 class="text-2xl sm:text-3xl font-bold mb-4">✅ QR Code Scan Result</h2>

    <p class="text-base sm:text-lg mb-3 break-all"><strong>🔗 URL:</strong> <span class="text-yellow-300 font-medium">{{ qr_data }}</span></p>
    <p class="text-base sm:text-lg mb-6"><strong>🔎 Classification:</strong> 
      <span class="text-yellow-300 font-bold">
        {{ classification }}
      </span>
    </p>

    <a href="{% url 'qr-scan' %}" class="inline-block w-full sm:w-auto bg-teal-600 hover:bg-teal-700 text-white px-8 py-3 rounded-xl font-semibold transition duration-300 rescan-button shadow-lg">
      🔁 Scan Another
    </a>
  </div>
</div>

{% endblock %}
