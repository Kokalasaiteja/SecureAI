name: Build SecureAI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SecureAI_Mobile_app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: SecureAI_Mobile_app
        run: flutter pub get

      - name: Build split release APKs
        working-directory: SecureAI_Mobile_app
        run: flutter build apk --split-per-abi --release

      - name: Build universal release APK
        working-directory: SecureAI_Mobile_app
        run: flutter build apk --release

      - name: Verify APKs and architectures
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="SecureAI_Mobile_app/build/app/outputs/flutter-apk"
          UNIVERSAL="$APK_DIR/app-release.apk"

          test -s "$UNIVERSAL"

          # Verify native libraries in the universal APK.
          unzip -Z1 "$UNIVERSAL" > /tmp/secureai-apk-files.txt

          for abi in armeabi-v7a arm64-v8a x86_64; do
            if grep -q "^lib/${abi}/" /tmp/secureai-apk-files.txt; then
              echo "PASS: Universal APK contains $abi"
            else
              echo "FAIL: Universal APK is missing $abi"
              exit 1
            fi
          done

          # Verify all expected APKs exist and are non-empty.
          for apk in \
            app-release.apk \
            app-arm64-v8a-release.apk \
            app-armeabi-v7a-release.apk \
            app-x86_64-release.apk
          do
            if [ ! -s "$APK_DIR/$apk" ]; then
              echo "FAIL: Missing or empty APK: $apk"
              exit 1
            fi

            echo "Verified: $apk"
            ls -lh "$APK_DIR/$apk"
            sha256sum "$APK_DIR/$apk"
          done

      - name: Stage APKs to web media directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p SecureAI_Web/media

          APK_DIR="SecureAI_Mobile_app/build/app/outputs/flutter-apk"
          MEDIA_DIR="SecureAI_Web/media"

          cp "$APK_DIR/app-release.apk" \
            "$MEDIA_DIR/app-release.apk"

          cp "$APK_DIR/app-arm64-v8a-release.apk" \
            "$MEDIA_DIR/app-arm64-v8a-release.apk"

          cp "$APK_DIR/app-armeabi-v7a-release.apk" \
            "$MEDIA_DIR/app-armeabi-v7a-release.apk"

          cp "$APK_DIR/app-x86_64-release.apk" \
            "$MEDIA_DIR/app-x86_64-release.apk"

          echo "APK files staged:"
          ls -lh "$MEDIA_DIR"/*.apk

      - name: Dynamically update APK sizes in documentation and modal
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_apk_sizes.py

      - name: Commit and push updated APKs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            SecureAI_Web/media/app-release.apk \
            SecureAI_Web/media/app-arm64-v8a-release.apk \
            SecureAI_Web/media/app-armeabi-v7a-release.apk \
            SecureAI_Web/media/app-x86_64-release.apk \
            README.md \
            SecureAI_Web/templates/apk_download_modal.html

          if git diff --cached --quiet; then
            echo "No APK changes detected. Nothing to commit."
          else
            git commit -m \
              "Auto-update SecureAI release APKs [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Upload universal APK
        uses: actions/upload-artifact@v6
        with:
          name: SecureAI-Universal-release
          path: SecureAI_Web/media/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v6
        with:
          name: SecureAI-arm64-v8a-release
          path: SecureAI_Web/media/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v6
        with:
          name: SecureAI-armeabi-v7a-release
          path: SecureAI_Web/media/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v6
        with:
          name: SecureAI-x86_64-release
          path: SecureAI_Web/media/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 7
